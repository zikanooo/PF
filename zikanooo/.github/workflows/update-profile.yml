name: Update Profile Assets

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=zikanooo&hide_border=true&border_radius=16&background=0F0A24&ring=A78BFA&fire=F472B6&currStreakLabel=E9D5FF&sideLabels=A5B4FC&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=8B8FB5
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Game contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: zikanooo
          games: "galaga"

      - name: Copy graph SVGs into assets
        run: cp dist/galaga-contribution-graph*.svg assets/

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: update profile assets" || exit 0
          git pull --rebase
          git push
