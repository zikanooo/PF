<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">zychocuwek banner</title>
<desc id="d">Animated banner for zychocuwek, web developer, with typing text and floating code symbols.</desc>
<style>.mono{font-family:"Courier New","DejaVu Sans Mono",monospace}.sans{font-family:"Segoe UI",Arial,Helvetica,sans-serif}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#090618"/><stop offset="0.5" stop-color="#1a0f3c"><animate attributeName="stop-color" values="#1a0f3c;#2a1054;#0d2a4a;#1a0f3c" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#071c33"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect"><stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/><animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0;-300 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="o1" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="o2" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="o3" cx="0.5" cy="0.5" r="0.5"><stop stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
<clipPath id="c0"><rect x="100" y="254" width="0" height="48"><animate attributeName="width" values="0;499;499;0;0" keyTimes="0.0;0.1333;0.2833;0.3333;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c1"><rect x="100" y="254" width="0" height="48"><animate attributeName="width" values="0;0;390;390;0;0" keyTimes="0;0.3333;0.4667;0.6167;0.6667;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c2"><rect x="100" y="254" width="0" height="48"><animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.6667;0.8;0.95;1.0" dur="12s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#grid)"/>
<circle cx="1040" cy="90" r="240" fill="url(#o1)"><animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="380" r="260" fill="url(#o2)"><animateTransform attributeName="transform" type="translate" values="0 0;80 -30;0 0" dur="13s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="40" r="200" fill="url(#o3)"><animateTransform attributeName="transform" type="translate" values="0 0;-40 60;0 0" dur="11s" repeatCount="indefinite"/></circle>
<rect y="0" width="1280" height="3" fill="#22d3ee" opacity="0.25"><animate attributeName="y" values="-10;410" dur="6s" repeatCount="indefinite"/></rect>
<text x="640" y="90" class="mono" font-size="30" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="7s" repeatCount="indefinite"/>&lt;/&gt;</text>
<text x="760" y="330" class="mono" font-size="34" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="9s" repeatCount="indefinite"/>{ }</text>
<text x="900" y="60" class="mono" font-size="28" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>01</text>
<text x="540" y="340" class="mono" font-size="26" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="8s" repeatCount="indefinite"/>( )</text>
<text x="1180" y="330" class="mono" font-size="30" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="10s" repeatCount="indefinite"/>=&gt;</text>
<text x="1210" y="70" class="mono" font-size="34" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="7s" repeatCount="indefinite"/>#</text>
<text x="700" y="40" class="mono" font-size="26" fill="#a78bfa" opacity="0.25"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.4;0.1" dur="11s" repeatCount="indefinite"/>::</text>

<g transform="translate(1030 205)" filter="url(#glow)">
<circle r="130" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 14"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
<circle r="100" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="40 20 8 20"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/></circle>
<circle r="68" stroke="#f472b6" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
<circle r="44" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"><animate attributeName="r" values="44;48;44" dur="3s" repeatCount="indefinite"/></circle>
<text y="12" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
</g>
<text x="100" y="118" class="mono" font-size="20" fill="#a78bfa">// hello world, i'm</text>
<text x="100" y="206" class="sans" font-size="96" font-weight="800" fill="url(#name)" filter="url(#glow)" letter-spacing="1">zychocuwek</text>
<rect x="100" y="228" width="150" height="6" rx="3" fill="url(#bar)"><animate attributeName="width" values="150;420;150" dur="5s" repeatCount="indefinite"/></rect>
<text x="100" y="262" class="mono" font-size="20" fill="#64748b">$</text>
<text x="100" y="288" clip-path="url(#c0)" class="mono" font-size="26" fill="#e9d5ff">Web Developer &amp; UI/UX Enthusiast</text>
<text x="100" y="288" clip-path="url(#c1)" class="mono" font-size="26" fill="#e9d5ff">Code. Break. Fix. Repeat.</text>
<text x="100" y="288" clip-path="url(#c2)" class="mono" font-size="26" fill="#e9d5ff">Building cool stuff, one commit at a time</text>
<g><rect y="260" width="3" height="34" fill="#22d3ee"><animate attributeName="x" values="100;599;599;100;100" keyTimes="0.0;0.1333;0.2833;0.3333;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect></g>
<g><rect y="260" width="3" height="34" fill="#22d3ee"><animate attributeName="x" values="100;100;490;490;100;100" keyTimes="0;0.3333;0.4667;0.6167;0.6667;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect></g>
<g><rect y="260" width="3" height="34" fill="#22d3ee"><animate attributeName="x" values="100;100;740;740;100" keyTimes="0;0.6667;0.8;0.95;1.0" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect></g>

<g transform="translate(100 332)"><rect width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/><circle cx="20" cy="17" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="5;7;5" dur="1.6s" repeatCount="indefinite"/></circle><text x="38" y="23" class="sans" font-size="15" fill="#d1fae5">open to collab</text></g>
</g>
<rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>